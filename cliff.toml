# git-cliff configuration for claudebar
#
# Used by `.github/workflows/release-prep.yml`, which runs
#
#   git-cliff --unreleased --tag <calver> --strip all > section.md
#   sed -i '/<!-- next-release -->/r section.md' CHANGELOG.md
#
# to splice one new section into CHANGELOG.md below the `<!-- next-release -->`
# marker. Historical, hand-written entries are never regenerated. cargo-dist then
# picks the `## [<version>]` section out of CHANGELOG.md for the GitHub Release
# body (dist autodetects the file — do NOT set a `changelog` key in
# [workspace.metadata.dist]; that key takes a path, not a generator name).
#
# Two non-obvious choices:
#
#   - `--prepend` is NOT used: it writes above the `# Changelog` header. Same
#     reason there is no footer link-anchor block — it would be re-emitted at
#     the top of the file on every release.
#   - The `<!-- N -->` group prefixes only force section order; the body
#     template strips them via `split(pat="-->") | last`.
#
# Local sanity check:
#   git-cliff --unreleased --tag 2026.8.14

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/).
Versions follow CalVer (`YYYY.M.PATCH`) with optional `-beta.N` pre-release suffixes;
see `RELEASING.md` for the release ritual.
"""

body = """

{% if version -%}
## [{{ version }}]{% if previous.version %}(https://github.com/micschr0/claudebar/compare/{{ previous.version }}...{{ version }}){% endif %}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | unique(attribute="message") | group_by(attribute="group") %}
### {{ group | split(pat="-->") | last | trim_start }}
{% for commit in commits | sort(attribute="message") -%}
- {{ commit.message | split(pat="\n") | first | trim_end | upper_first }}
{% endfor -%}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "[0-9]+\\.[0-9]+\\.[0-9]+(-[a-zA-Z]+\\.[0-9]+)?"
topo_order = false

# Keep-a-Changelog sections. `chore` is dropped entirely — the overwhelming
# majority are Renovate dependency bumps, which are not user-facing for a
# statusline renderer. To surface non-dep chores, skip only `^chore\\(deps` and
# map the rest to Changed.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^(perf|refactor|style)", group = "<!-- 2 -->Changed" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^test", group = "<!-- 4 -->Testing" },
  { message = "^(ci|build)", group = "<!-- 5 -->CI" },
  { message = "^chore", skip = true },
]
