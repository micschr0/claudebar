# Release preparation for claudebar's CalVer scheme.
#
#   1. `prepare` (manual dispatch) opens a PR: Cargo.toml version bump,
#      synced Cargo.lock, and a CHANGELOG.md section generated by git-cliff.
#   2. `tag` (push to main touching Cargo.toml) creates the matching git tag,
#      which triggers release.yml.
#
# Cargo.toml's version stays the single source of truth (RELEASING.md §1).
# The tag ref is created with a GitHub App token on purpose: a tag created with
# GITHUB_TOKEN does not trigger other workflows, so release.yml would never fire.

name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        # -beta.N is explicit on purpose: release.yml prunes every prerelease tag
        # but the newest, so N cannot be derived from the tag list.
        description: "CalVer, no leading zeros (default: today). YYYY.M.D[-beta.N]"
        type: string
  push:
    branches: [main]
    paths: ["Cargo.toml"]

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

# Default deny-all. Write access comes from the GitHub App token, not GITHUB_TOKEN.
permissions: {}

jobs:
  prepare:
    name: Open release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: "micschr0"
          repositories: "claudebar"
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: git-cliff walks commits, and the compare link
          # in the version heading needs the previous tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: git-cliff

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$(date -u +%Y.%-m.%-d)}"
          # Leading zeros are invalid semver and break both Cargo and dist.
          [[ "$version" =~ ^[0-9]{4}\.[1-9][0-9]*\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]] \
            || { echo "::error::'$version' is not valid CalVer (YYYY.M.D[-beta.N], no leading zeros)"; exit 1; }
          [[ -z "$(git tag -l "$version")" ]] \
            || { echo "::error::tag $version already exists"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump version and sync lockfile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only the first `version = ` line — that is [package].version.
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          grep -qx "version = \"$VERSION\"" Cargo.toml
          # Resolves and rewrites Cargo.lock without compiling anything.
          # Not --offline: a fresh runner has no registry index to resolve against.
          cargo metadata --format-version 1 >/dev/null

      - name: Generate changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          section="$RUNNER_TEMP/section.md"
          git-cliff --unreleased --tag "$VERSION" --strip all > "$section"
          grep -q '^### ' "$section" \
            || { echo "::error::git-cliff produced no entries — nothing to release"; exit 1; }
          grep -q '<!-- next-release -->' CHANGELOG.md
          sed -i "/<!-- next-release -->/r $section" CHANGELOG.md

      - name: Commit and open PR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$VERSION"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" "HEAD:refs/heads/release/$VERSION"
          gh pr create --head "release/$VERSION" --base main --title "chore(release): $VERSION" \
            --body "Automated release prep. Merging this tags \`$VERSION\`, which triggers \`release.yml\`."

  tag:
    name: Push release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: "micschr0"
          repositories: "claudebar"
          permission-contents: write

      # Shallow: only Cargo.toml is read; the tag is created through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag if Cargo.toml version is untagged
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if gh api "repos/$REPO/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists — nothing to do."; exit 0
          fi
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$version" -f sha="$SHA" >/dev/null
          echo "Created tag $version"
