name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: openwiki-update-${{ github.ref }}
  cancel-in-progress: false

# Default deny-all. The update job re-grants only what create-pull-request
# needs: contents: write to push the openwiki/update branch, pull-requests:
# write to open the PR against it.
permissions: {}

jobs:
  update:
    name: OpenWiki update
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the openwiki/update branch
      pull-requests: write  # open or reuse the PR against it
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # The secrets context is not readable from a job-level `if:`, so the guard
      # has to be a step that later steps key off. Without it every scheduled run
      # goes red on a repo that has no key configured.
      - name: Check for OpenRouter API key
        id: guard
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "OPENROUTER_API_KEY is not set - skipping the OpenWiki update." >> "${GITHUB_STEP_SUMMARY}"
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install OpenWiki
        if: steps.guard.outputs.enabled == 'true'
        # mermaid + jsdom are optional; they add high-fidelity validation of Mermaid diagrams. Remove if your wiki has none.
        run: npm install --global openwiki@0.4.0 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        if: steps.guard.outputs.enabled == 'true'
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENWIKI_MODEL_ID: "deepseek/deepseek-v4-flash-0731"

      - name: Create OpenWiki update pull request
        if: steps.guard.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
