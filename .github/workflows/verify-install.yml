name: Verify install.sh

# End-to-end install.sh against published release assets — catches asset-naming mismatches before users hit 404s.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (defaults to latest stable)"
        required: false
        type: string

permissions: {}
concurrency:
  group: verify-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RELEASE_TAG:-}}"
          if [[ -z "$tag" ]]; then tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); fi
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || { echo "::error::Invalid release tag: $tag"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify-linux:
    name: Verify Linux
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run install.sh in a clean HOME (no cargo — forces Tier 1)
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDEBAR_VERSION: ${{ needs.resolve-release.outputs.version }}
          CLAUDEBAR_TARGET: ${{ matrix.target }}
          CLAUDEBAR_SKIP_SETUP: ${{ matrix.target == 'aarch64-unknown-linux-musl' && '1' || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          export HOME="$RUNNER_TEMP/verify-home"
          mkdir -p "$HOME"

          # Strip cargo/rustc from PATH so a broken prebuilt download (Tier 1)
          # can't be silently masked by falling through to `cargo build` (Tier 2).
          stripped_path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '\.cargo/bin' | tr '\n' ':' | sed 's/:$//') || true
          export PATH="$stripped_path"
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo still on PATH: $(command -v cargo) — PATH stripping failed" >&2
            exit 1
          fi

          # Piped stdin execution (no BASH_SOURCE) — matches the documented
          # `curl | bash` usage and catches unbound-variable bugs that only
          # surface without a source file.
          cat install.sh | bash
          test -x "$HOME/.claude/claudebar"
          if [ "$(uname -m)" = "x86_64" ] && [[ "$TARGET" == x86_64-* ]]; then
            test "$("$HOME/.claude/claudebar" --version)" = "claudebar $CLAUDEBAR_VERSION"
          fi

          rm -rf "$HOME/.claude"
          mkdir -p "$HOME"

          bash install.sh

          test -x "$HOME/.claude/claudebar"

          # The runner is x86_64 — an aarch64 binary can't execute here without
          # emulation. CLAUDEBAR_TARGET only needs to prove the matching asset
          # downloads, verifies, and extracts; only run it when arch matches.
          if [ "$(uname -m)" = "x86_64" ] && [[ "$TARGET" == x86_64-* ]]; then
            test "$("$HOME/.claude/claudebar" --version)" = "claudebar $CLAUDEBAR_VERSION"
            echo '{}' | "$HOME/.claude/claudebar" render
          fi

  verify-macos:
    name: Verify macOS
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run install.sh in a clean HOME (no cargo — forces Tier 1)
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDEBAR_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          export HOME="$RUNNER_TEMP/verify-home"
          mkdir -p "$HOME"

          # Strip cargo/rustc from PATH so a broken prebuilt download (Tier 1)
          # can't be silently masked by falling through to `cargo build` (Tier 2).
          stripped_path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '\.cargo/bin' | tr '\n' ':' | sed 's/:$//') || true
          export PATH="$stripped_path"
          if command -v cargo >/dev/null 2>&1; then
            echo "cargo still on PATH: $(command -v cargo) — PATH stripping failed" >&2
            exit 1
          fi

          # Piped stdin execution (no BASH_SOURCE) — matches the documented
          # `curl | bash` usage and catches unbound-variable bugs that only
          # surface without a source file.
          cat install.sh | bash
          test "$("$HOME/.claude/claudebar" --version)" = "claudebar $CLAUDEBAR_VERSION"

          rm -rf "$HOME/.claude"
          mkdir -p "$HOME"

          bash install.sh

          test -x "$HOME/.claude/claudebar"
          test "$("$HOME/.claude/claudebar" --version)" = "claudebar $CLAUDEBAR_VERSION"
          echo '{}' | "$HOME/.claude/claudebar" render
