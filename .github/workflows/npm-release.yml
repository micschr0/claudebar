name: Publish npm

# Runs AFTER a GitHub Release is published so it reuses the exact, already-
# attested binaries built by release.yml. Publishes @micschr0/claudebar + the
# per-platform optionalDependency packages (Biome/esbuild/Tailwind pattern).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to npm"
        required: false

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name || '' }}
          INPUT_TAG: ${{ inputs.tag || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-${EVENT_TAG}}"
          [ -n "$tag" ] || tag="$(gh release list --repo micschr0/claudebar --limit 1 --json tagName --jq '.[0].tagName')"
          [ -n "$tag" ] || { echo "::error::could not resolve release tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" --repo micschr0/claudebar \
            --dir "$RUNNER_TEMP/release" --pattern 'claudebar-*.tar.gz'

      - name: Extract native binaries
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/release"
          for a in claudebar-*.tar.gz; do
            t="${a#claudebar-}"; t="${t%.tar.gz}"
            mkdir -p "$RUNNER_TEMP/extracted/$t"
            tar -xzf "$a" -C "$RUNNER_TEMP/extracted/$t"
          done

      - name: Assemble publishable packages (templates + version + binary)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p npm-publish
          cp -r npm/main npm-publish/main
          for p in darwin-x64 darwin-arm64 linux-x64-musl linux-arm64-musl; do
            cp -r "npm/platforms/$p" "npm-publish/$p"
          done
          sed -i "s/0\.0\.0/${{ steps.tag.outputs.tag }}/g" npm-publish/*/package.json
          ext="$RUNNER_TEMP/extracted"
          cp "$ext/x86_64-apple-darwin/claudebar"     npm-publish/darwin-x64/claudebar
          cp "$ext/aarch64-apple-darwin/claudebar"    npm-publish/darwin-arm64/claudebar
          cp "$ext/x86_64-unknown-linux-musl/claudebar" npm-publish/linux-x64-musl/claudebar
          cp "$ext/aarch64-unknown-linux-musl/claudebar" npm-publish/linux-arm64-musl/claudebar
          chmod +x npm-publish/*/claudebar

      - name: Smoke-test wrapper (host platform)
        run: |
          pkg="$GITHUB_WORKSPACE/npm-publish/main"
          plat="$pkg/node_modules/@micschr0/claudebar-linux-x64-musl"
          mkdir -p "$plat"
          # Mirror a real install: platform package.json + binary.
          cp npm-publish/linux-x64-musl/package.json "$plat/"
          cp "$RUNNER_TEMP/extracted/x86_64-unknown-linux-musl/claudebar" "$plat/claudebar"
          chmod +x "$plat/claudebar"
          node "$pkg/bin/claudebar.js" --version

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in darwin-x64 darwin-arm64 linux-x64-musl linux-arm64-musl; do
            (cd "npm-publish/$p" && npm publish --access public)
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: (cd npm-publish/main && npm publish --access public)
